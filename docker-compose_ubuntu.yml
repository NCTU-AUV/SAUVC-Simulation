services:
  orca:
    container_name: ${CONTAINER_NAME:-orca-auv-gazebo-simulation-container}
    image: ${IMAGE_NAME:-orca-auv-gazebo-simulation-image}:latest
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true

    gpus: all
    network_mode: host
    ipc: host

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute,display
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}

    volumes:
      - ./sim_ws:/root/sim_ws
      - ./certs:/ign-certs:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    devices:
      - /dev/dri:/dev/dri

    working_dir: /root
    command: ["/bin/bash", "-lc", "tail -f /dev/null"]
